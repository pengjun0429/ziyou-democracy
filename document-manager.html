    <script>
        // 修復環境中 window.fetch 僅有 getter 無 setter 導致的 TypeError: Cannot set property fetch of #<Window> which has only a getter
        (function() {
            try {
                var nativeFetch = typeof window !== 'undefined' ? window.fetch : null;
                var currentFetch = nativeFetch ? function() { return nativeFetch.apply(window, arguments); } : null;
                var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
                if (!desc && typeof Window !== 'undefined' && Window.prototype) {
                    desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
                }
                if (!desc || (desc.get && !desc.set) || desc.writable === false) {
                    Object.defineProperty(window, 'fetch', {
                        get: function() { return currentFetch; },
                        set: function(newFetch) { currentFetch = newFetch; },
                        configurable: true,
                        enumerable: true
                    });
                }
            } catch (e) {}
        })();
    </script>

2. 兒少絕對保護：
凡涉及未滿十八歲國民之性影像散布、持有、或誘騙媒介者，列為重罪。除依法沒入電子設備外，加處高額罰鍰並強制接受唯一真神的三週心理輔導。

3. 學術藝術免責：
基於醫療、學術研究或純粹藝術創作，且已採取嚴格成人年齡驗證與遮蔽隔離措施者，不予處罰。`
            },
            'education-involution': {
                title: '學習與教育內卷管理處罰條例',
                category: '身心保障',
                content: `資優民主國 學習與教育內卷管理處罰條例
資優民主國115年5月29日公布實施

一、立法目的：
為杜絕教育體制中「唯有讀書高」之畸形風氣，禁止超前教育、死記硬背等消磨創造力之行為，特制定本條例。

二、核心違法行為：
1. 禁止超前與過度學習（刷題條款）：
嚴禁學生在法定課堂時間外，每日進行重複性刷題超過兩小時。違者沒收教材，強制從事戶外運動或電玩遊戲減壓。

2. 禁止無效證照與軍備競賽：
嚴禁家長強迫學童考取非適性之各類高級語文或技能檢定證照。

3. 嚴禁教育機構惡性排名：
嚴禁學校與校外機構公開張貼「英雄榜」或「成績排名表」。

三、合法學習之豁免範圍：
凡基於個人興趣，自主進行之園藝、烹飪、哲學思辨、藝術塗鴉、動漫研究等非功利性學習，一律不受本條例限制。
學校應全面推行「發呆課」與「白日夢創新時間」，出席率得抵免傳統學科分數。`
            }
        };

        let docs = JSON.parse(localStorage.getItem('ziyou_docs'));
        if (!docs || Object.keys(docs).length === 0) {
            docs = JSON.parse(JSON.stringify(officialDocuments));
            localStorage.setItem('ziyou_docs', JSON.stringify(docs));
        }

        let currentDocKey = 'constitution';
        let isPreviewMode = false;

        function renderDocList() {
            const listEl = document.getElementById('docNavList');
            const search = (document.getElementById('docSearchInput').value || '').toLowerCase().trim();
            const keys = Object.keys(docs);

            document.getElementById('docCountBadge').textContent = keys.length + ' 份';

            const filteredKeys = keys.filter(k => {
                const doc = docs[k];
                return !search || 
                    doc.title.toLowerCase().includes(search) || 
                    (doc.category || '').toLowerCase().includes(search) ||
                    doc.content.toLowerCase().includes(search);
            });

            if (filteredKeys.length === 0) {
                listEl.innerHTML = '<li style="color:var(--text-muted); font-size:0.85rem; padding:1rem; text-align:center;">無相符之文件</li>';
                return;
            }

            listEl.innerHTML = filteredKeys.map(k => {
                const d = docs[k];
                const activeClass = k === currentDocKey ? 'active' : '';
                return `
                    <li class="doc-item ${activeClass}" onclick="switchDoc('${k}')">
                        <div class="doc-item-title">${d.title}</div>
                        <div class="doc-item-meta">
                            <span>${d.category || '條例'}</span>
                            <span>${d.content.length} 字</span>
                        </div>
                    </li>
                `;
            }).join('');
        }

        function switchDoc(key) {
            if (!docs[key]) return;
            currentDocKey = key;
            const d = docs[key];

            document.getElementById('docTitleInput').value = d.title;
            document.getElementById('editorTextarea').value = d.content;
            
            // 是否為預設官方文件
            const isProtected = ['constitution', 'anti-infiltration', 'anti-involution', 'public-morality', 'education-involution'].includes(key);
            document.getElementById('deleteDocBtn').style.display = isProtected ? 'none' : 'inline-flex';

            renderDocList();
            updateWordCount();

            if (isPreviewMode) {
                renderPreview();
            }
        }

        function updateCurrentDocTitle() {
            if (!docs[currentDocKey]) return;
            docs[currentDocKey].title = document.getElementById('docTitleInput').value.trim() || '未命名文件';
            renderDocList();
        }

        function updateWordCount() {
            const text = document.getElementById('editorTextarea').value;
            document.getElementById('charCount').textContent = `字數：${text.length}`;
            const lines = text.split('\n').length;
            document.getElementById('lineCount').textContent = `行數：${lines}`;
            document.getElementById('saveStatus').textContent = '有尚未儲存的變更...';
        }

        function saveDoc() {
            if (!docs[currentDocKey]) return;
            docs[currentDocKey].title = document.getElementById('docTitleInput').value.trim() || '未命名文件';
            docs[currentDocKey].content = document.getElementById('editorTextarea').value;

            localStorage.setItem('ziyou_docs', JSON.stringify(docs));
            document.getElementById('saveStatus').textContent = '✅ 已成功儲存至本地檔案庫 (' + new Date().toLocaleTimeString() + ')';
            renderDocList();
            showToast('文件儲存成功！');
        }

        function togglePreview() {
            isPreviewMode = !isPreviewMode;
            const textarea = document.getElementById('editorTextarea');
            const previewBox = document.getElementById('previewBox');
            const btn = document.getElementById('togglePreviewBtn');

            if (isPreviewMode) {
                renderPreview();
                textarea.style.display = 'none';
                previewBox.style.display = 'block';
                btn.classList.add('active');
                btn.innerHTML = '<span>✏️</span> 返回編輯';
            } else {
                textarea.style.display = 'block';
                previewBox.style.display = 'none';
                btn.classList.remove('active');
                btn.innerHTML = '<span>👁️</span> 預覽排版';
            }
        }

        function renderPreview() {
            const previewBox = document.getElementById('previewBox');
            const content = document.getElementById('editorTextarea').value;
            previewBox.textContent = content;
        }

        function copyContent() {
            const content = document.getElementById('editorTextarea').value;
            navigator.clipboard.writeText(content).then(() => {
                showToast('📋 已複製全文至剪貼簿！');
            }).catch(() => {
                showToast('⚠️ 複製失敗，請手動複製。');
            });
        }

        function exportDoc() {
            const d = docs[currentDocKey];
            if (!d) return;
            const blob = new Blob([d.content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${d.title}.txt`;
            link.click();
            showToast('已匯出純文字檔！');
        }

        function restoreDefaults() {
            if (confirm('確定要將官方憲法與四部條例還原為初始法定版本嗎？')) {
                docs = JSON.parse(JSON.stringify(officialDocuments));
                localStorage.setItem('ziyou_docs', JSON.stringify(docs));
                switchDoc('constitution');
                showToast('已恢復官方版本！');
            }
        }

        function createNewDoc() {
            const newKey = 'doc_' + Date.now();
            docs[newKey] = {
                title: '新制條例或政府公報草案',
                category: '草案',
                content: `資優民主國 【新條例名稱】草案
民國 115 年 月 日

第一條（立法旨趣）
本草案旨在強化國民快樂自主學習權益...`
            };
            switchDoc(newKey);
            showToast('已建立新文件草案！');
        }

        function deleteCurrentDoc() {
            if (confirm(`確定要刪除「${docs[currentDocKey].title}」嗎？此動作無法復原。`)) {
                delete docs[currentDocKey];
                localStorage.setItem('ziyou_docs', JSON.stringify(docs));
                const remainingKeys = Object.keys(docs);
                switchDoc(remainingKeys[0] || 'constitution');
                showToast('文件已刪除。');
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'notification';
            toast.innerHTML = `<div class="notification-content"><span class="notification-message">${msg}</span></div>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 初始化
        function initApp() {
            switchDoc('constitution');
        }
    </script>
    <!-- 引入國家安全認證模組 (要求密碼才能訪問與操作文件管理系統) -->
    <script src="auth-gate.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.ZiyuAuthGate) {
                window.ZiyuAuthGate.init({
                    systemName: '文件與法規公報管理系統',
                    systemIcon: '📜',
                    contentSelector: 'main',
                    onUnlockSuccess: function() {
                        initApp();
                    }
                });
            } else {
                initApp();
            }
        });
    </script>
</body>
</html>
